<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Raw versus processed integration in BRIDGE</title>
  <desc id="desc">A two-lane comparison of raw integration and processed integration workflows.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#2f4b4f"/>
    </marker>
  </defs>
  <rect width="1200" height="620" rx="30" fill="#f7faf7"/>
  <text x="60" y="58" font-family="Atkinson Hyperlegible, Verdana, sans-serif" font-size="30" font-weight="700" fill="#183135">Raw integration vs processed integration</text>
  <text x="60" y="88" font-family="Atkinson Hyperlegible, Verdana, sans-serif" font-size="16" fill="#52696d">Both compare loaded datasets, but they answer different questions and use different inputs.</text>

  <g font-family="Atkinson Hyperlegible, Verdana, sans-serif">
    <rect x="50" y="125" width="1100" height="195" rx="26" fill="#eef7f4" stroke="#b4cbc6" stroke-width="2"/>
    <rect x="50" y="360" width="1100" height="205" rx="26" fill="#fff8e8" stroke="#d5c294" stroke-width="2"/>

    <text x="85" y="164" font-size="22" font-weight="700" fill="#1f3a3d">Raw integration</text>
    <text x="85" y="190" font-size="14" fill="#52696d">Question: do selected features show similar trends across omics layers before significance filtering?</text>

    <g>
      <rect x="90" y="220" width="175" height="62" rx="16" fill="#ffffff" stroke="#77a99d" stroke-width="2"/>
      <text x="177.5" y="246" text-anchor="middle" font-size="14" font-weight="700" fill="#1f3a3d">Loaded datasets</text>
      <text x="177.5" y="266" text-anchor="middle" font-size="12" fill="#5b6d70">two or more tables</text>
    </g>
    <line x1="275" y1="251" x2="335" y2="251" stroke="#2f4b4f" stroke-width="3" marker-end="url(#arrow)"/>
    <g>
      <rect x="345" y="220" width="210" height="62" rx="16" fill="#ffffff" stroke="#77a99d" stroke-width="2"/>
      <text x="450" y="246" text-anchor="middle" font-size="14" font-weight="700" fill="#1f3a3d">Select columns</text>
      <text x="450" y="266" text-anchor="middle" font-size="12" fill="#5b6d70">matching biological order</text>
    </g>
    <line x1="565" y1="251" x2="625" y2="251" stroke="#2f4b4f" stroke-width="3" marker-end="url(#arrow)"/>
    <g>
      <rect x="635" y="220" width="205" height="62" rx="16" fill="#ffffff" stroke="#77a99d" stroke-width="2"/>
      <text x="737.5" y="246" text-anchor="middle" font-size="14" font-weight="700" fill="#1f3a3d">Align by position</text>
      <text x="737.5" y="266" text-anchor="middle" font-size="12" fill="#5b6d70">stage-to-stage</text>
    </g>
    <line x1="850" y1="251" x2="910" y2="251" stroke="#2f4b4f" stroke-width="3" marker-end="url(#arrow)"/>
    <g>
      <rect x="920" y="220" width="185" height="62" rx="16" fill="#ffffff" stroke="#77a99d" stroke-width="2"/>
      <text x="1012.5" y="246" text-anchor="middle" font-size="14" font-weight="700" fill="#1f3a3d">Compare raw trends</text>
      <text x="1012.5" y="266" text-anchor="middle" font-size="12" fill="#5b6d70">exploratory signal view</text>
    </g>

    <text x="85" y="399" font-size="22" font-weight="700" fill="#1f3a3d">Processed integration</text>
    <text x="85" y="425" font-size="14" fill="#52696d">Question: which significant IDs are shared across datasets under comparable contrasts?</text>

    <g>
      <rect x="90" y="455" width="175" height="62" rx="16" fill="#ffffff" stroke="#bd8f2f" stroke-width="2"/>
      <text x="177.5" y="481" text-anchor="middle" font-size="14" font-weight="700" fill="#1f3a3d">Processed outputs</text>
      <text x="177.5" y="501" text-anchor="middle" font-size="12" fill="#5b6d70">contrasts available</text>
    </g>
    <line x1="275" y1="486" x2="335" y2="486" stroke="#2f4b4f" stroke-width="3" marker-end="url(#arrow)"/>
    <g>
      <rect x="345" y="455" width="210" height="62" rx="16" fill="#ffffff" stroke="#bd8f2f" stroke-width="2"/>
      <text x="450" y="481" text-anchor="middle" font-size="14" font-weight="700" fill="#1f3a3d">Choose contrasts</text>
      <text x="450" y="501" text-anchor="middle" font-size="12" fill="#5b6d70">comparable biology</text>
    </g>
    <line x1="565" y1="486" x2="625" y2="486" stroke="#2f4b4f" stroke-width="3" marker-end="url(#arrow)"/>
    <g>
      <rect x="635" y="455" width="205" height="62" rx="16" fill="#ffffff" stroke="#bd8f2f" stroke-width="2"/>
      <text x="737.5" y="481" text-anchor="middle" font-size="14" font-weight="700" fill="#1f3a3d">Apply thresholds</text>
      <text x="737.5" y="501" text-anchor="middle" font-size="12" fill="#5b6d70">p-value + LFC</text>
    </g>
    <line x1="850" y1="486" x2="910" y2="486" stroke="#2f4b4f" stroke-width="3" marker-end="url(#arrow)"/>
    <g>
      <rect x="920" y="455" width="185" height="62" rx="16" fill="#ffffff" stroke="#bd8f2f" stroke-width="2"/>
      <text x="1012.5" y="481" text-anchor="middle" font-size="14" font-weight="700" fill="#1f3a3d">Intersect IDs</text>
      <text x="1012.5" y="501" text-anchor="middle" font-size="12" fill="#5b6d70">heatmaps and LFC plots</text>
    </g>
  </g>
</svg>
